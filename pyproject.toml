[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-os"
version = "0.2.0"
description = "MakeCrew: an adaptive, model-agnostic AI work framework with requirement clarification, local-first Skill discovery, agent routing, memory, verification, recovery, and evidence-gated self-evolution"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "AI Company OS contributors"}]

[project.urls]
Homepage = "https://github.com/GodMaking/makecrew"
Repository = "https://github.com/GodMaking/makecrew"

[project.scripts]
ai-company-route = "ai_company_os.cli:main"
ai-company-demo = "ai_company_os.web:serve"
makecrew = "ai_company_os.bootstrap_cli:main"
agentflow = "ai_company_os.bootstrap_cli:main"
agentflow-route = "ai_company_os.cli:main"

[tool.setuptools.packages.find]
include = ["ai_company_os*"]

[tool.setuptools.data-files]
"share/agentflow-os/skills/agentflow-os" = ["skills/agentflow-os/SKILL.md"]
"share/agentflow-os/skills/api-and-interface-design" = ["skills/api-and-interface-design/SKILL.md"]
"share/agentflow-os/skills/checkpoint-recovery" = ["skills/checkpoint-recovery/SKILL.md"]
"share/agentflow-os/skills/ci-cd-and-automation" = ["skills/ci-cd-and-automation/SKILL.md"]
"share/agentflow-os/skills/context-engineering" = ["skills/context-engineering/SKILL.md"]
"share/agentflow-os/skills/debugging-and-error-recovery" = ["skills/debugging-and-error-recovery/SKILL.md"]
"share/agentflow-os/skills/frontend-ui-engineering" = ["skills/frontend-ui-engineering/SKILL.md"]
"share/agentflow-os/skills/git-workflow-and-versioning" = ["skills/git-workflow-and-versioning/SKILL.md"]
"share/agentflow-os/skills/interview-me" = ["skills/interview-me/SKILL.md"]
"share/agentflow-os/skills/makecrew" = ["skills/makecrew/SKILL.md"]
"share/agentflow-os/skills/parallel-dispatch" = ["skills/parallel-dispatch/SKILL.md"]
"share/agentflow-os/skills/planning-and-task-breakdown" = ["skills/planning-and-task-breakdown/SKILL.md"]
"share/agentflow-os/skills/product-delivery" = ["skills/product-delivery/SKILL.md"]
"share/agentflow-os/skills/review-and-critique" = ["skills/review-and-critique/SKILL.md"]
"share/agentflow-os/skills/self-evolution" = ["skills/self-evolution/SKILL.md"]
"share/agentflow-os/skills/shipping-and-launch" = ["skills/shipping-and-launch/SKILL.md"]
"share/agentflow-os/skills/skill-audit" = ["skills/skill-audit/SKILL.md"]
"share/agentflow-os/skills/source-driven-development" = ["skills/source-driven-development/SKILL.md"]
